<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Model and Harness co-evolution</title>
  <desc id="desc">A technical banner showing model releases and harness releases accelerating each other through deployment traces, evaluation, and training.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#24303A" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#43C6DB"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF7A66"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="8" fill="#0B1016"/>
  <rect width="1200" height="420" rx="8" fill="url(#grid)"/>
  <path d="M0 0H1200V5H0Z" fill="#43C6DB"/>
  <path d="M780 0H1200V5H780Z" fill="#FF7A66"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="58" fill="#8EA0AE" font-size="13" font-weight="700">WUZHONG YANQIU / AGENT SYSTEMS</text>
    <text x="58" y="105" fill="#F4F7F9" font-size="34" font-weight="750">MODEL x HARNESS</text>
    <text x="58" y="135" fill="#AAB7C2" font-size="17">Co-evolving release loops for capable, reliable agents</text>

    <g transform="translate(58 178)">
      <rect width="300" height="118" rx="8" fill="#111A22" stroke="#43C6DB" stroke-width="2"/>
      <rect x="18" y="18" width="48" height="26" rx="4" fill="#123942"/>
      <text x="42" y="36" fill="#70D7E7" font-size="12" font-weight="700" text-anchor="middle">MODEL</text>
      <text x="18" y="76" fill="#F4F7F9" font-size="25" font-weight="700">DeepSeek</text>
      <text x="18" y="101" fill="#8EA0AE" font-size="14">Reasoning / capability / policy</text>
    </g>

    <g transform="translate(842 178)">
      <rect width="300" height="118" rx="8" fill="#111A22" stroke="#FF7A66" stroke-width="2"/>
      <rect x="18" y="18" width="61" height="26" rx="4" fill="#45251F"/>
      <text x="48.5" y="36" fill="#FF9B8C" font-size="12" font-weight="700" text-anchor="middle">HARNESS</text>
      <text x="18" y="76" fill="#F4F7F9" font-size="25" font-weight="700">Hermes Agent</text>
      <text x="18" y="101" fill="#8EA0AE" font-size="14">Context / tools / memory / runtime</text>
    </g>

    <path d="M378 216 C520 154, 680 154, 822 216" fill="none" stroke="#43C6DB" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <rect x="431" y="147" width="338" height="27" rx="4" fill="#0B1016"/>
    <text x="600" y="166" fill="#70D7E7" font-size="13" font-weight="650" text-anchor="middle">NEW CAPABILITY UNLOCKS A BETTER HARNESS</text>

    <path d="M822 267 C680 329, 520 329, 378 267" fill="none" stroke="#FF7A66" stroke-width="3" marker-end="url(#arrow-coral)"/>
    <text x="600" y="329" fill="#FF9B8C" font-size="13" font-weight="650" text-anchor="middle">RUNTIME TRACES SHAPE THE NEXT MODEL</text>

    <g transform="translate(58 358)">
      <text x="0" y="19" fill="#6F8291" font-size="12" font-weight="700">THE FLYWHEEL</text>
      <text x="135" y="19" fill="#D7DEE4" font-size="14">release</text>
      <text x="199" y="19" fill="#647583" font-size="14">-&gt;</text>
      <text x="229" y="19" fill="#D7DEE4" font-size="14">deploy</text>
      <text x="291" y="19" fill="#647583" font-size="14">-&gt;</text>
      <text x="321" y="19" fill="#D7DEE4" font-size="14">trace</text>
      <text x="370" y="19" fill="#647583" font-size="14">-&gt;</text>
      <text x="400" y="19" fill="#D7DEE4" font-size="14">evaluate</text>
      <text x="468" y="19" fill="#647583" font-size="14">-&gt;</text>
      <text x="498" y="19" fill="#D7DEE4" font-size="14">train</text>
      <text x="543" y="19" fill="#647583" font-size="14">-&gt;</text>
      <text x="573" y="19" fill="#F4F7F9" font-size="14" font-weight="700">release again</text>
    </g>

    <text x="1142" y="382" fill="#687A88" font-size="12" text-anchor="end">TOWARD AGI / ONE ITERATION AT A TIME</text>
  </g>
</svg>
