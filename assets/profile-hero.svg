<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">The next frontier is taste — a working thesis</title>
  <desc id="desc">Aesthetic intelligence and generalization. Diverse task experience grounds competence; aesthetic judgment may transfer across tasks. Flowing lines converge into a coherent form, suggesting the relationship between experience, judgment, and transfer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10171d"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e2ded2"/>
      <stop offset="0.5" stop-color="#83d3c8"/>
      <stop offset="1" stop-color="#8a91b7"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#26343d" stroke-width="1" opacity="0.32"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" rx="14" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1599" height="519" rx="14" fill="none" stroke="#28343c"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="58" font-size="24" font-weight="600" letter-spacing="3" fill="#9caeb8">WUZHONG YANQIU</text>
    <text x="1528" y="58" text-anchor="end" font-size="24" letter-spacing="3" fill="#9caeb8">AESTHETIC INTELLIGENCE</text>
    <text x="72" y="125" font-size="23" letter-spacing="3" fill="#c8c1ab">A WORKING THESIS</text>
    <text x="68" y="226" font-size="88" font-weight="700" letter-spacing="-2" fill="#f3f1e9">The next frontier</text>
    <text x="68" y="326" font-size="98" font-weight="700" letter-spacing="-2" fill="#f3f1e9">is <tspan fill="#83d3c8">taste.</tspan></text>
    <path d="M72 368H935" stroke="#334047"/>
    <text x="72" y="411" font-size="28" fill="#b2bec4">Task diversity grounds competence.</text>
    <text x="72" y="451" font-size="28" fill="#b2bec4">Could aesthetic judgment transfer across tasks?</text>
    <g fill="none" stroke="url(#ribbon)" stroke-width="2.5">
      <path d="M1020 183C1128 108 1204 345 1334 271S1448 142 1514 200" opacity="0.35"/>
      <path d="M1020 216C1146 112 1190 357 1334 271S1445 158 1514 218" opacity="0.5"/>
      <path d="M1020 249C1148 127 1204 355 1334 271S1453 176 1514 236" opacity="0.7"/>
      <path d="M1020 282C1156 148 1198 347 1334 271S1456 196 1514 254"/>
      <path d="M1020 315C1154 174 1213 344 1334 271S1458 216 1514 272" opacity="0.8"/>
      <path d="M1020 348C1147 203 1222 336 1334 271S1455 236 1514 290" opacity="0.55"/>
      <path d="M1020 381C1140 232 1235 327 1334 271S1450 256 1514 308" opacity="0.35"/>
    </g>
    <circle cx="1334" cy="271" r="7" fill="#e2ded2"/>
    <text x="1020" y="440" font-size="23" letter-spacing="1" fill="#8da2ad">EXPERIENCE</text>
    <text x="1280" y="440" text-anchor="middle" font-size="23" letter-spacing="1" fill="#b7cfc8">JUDGMENT</text>
    <text x="1514" y="440" text-anchor="end" font-size="23" letter-spacing="1" fill="#8da2ad">TRANSFER</text>
  </g>
</svg>
