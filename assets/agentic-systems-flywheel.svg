<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The agentic systems flywheel</title>
  <desc id="desc">A model, agent runtime, and verifiable environment form a closed learning loop through actions, trajectories, rewards, and evolution.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#26313A" stroke-width="1" opacity="0.34"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#45D2E8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9DE65C"/>
    </marker>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#FF806E"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="8" fill="#080D12"/>
  <rect width="1200" height="500" rx="8" fill="url(#grid)"/>
  <rect x="0" y="0" width="400" height="5" fill="#45D2E8"/>
  <rect x="400" y="0" width="400" height="5" fill="#9DE65C"/>
  <rect x="800" y="0" width="400" height="5" fill="#FF806E"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="58" y="54" fill="#7F919E" font-size="13" font-weight="700">AGENT SYSTEMS / THE NEXT SCALING LOOP</text>
    <text x="58" y="99" fill="#F5F7F9" font-size="34" font-weight="760">INTELLIGENCE IS A SYSTEM PROPERTY</text>
    <text x="58" y="130" fill="#A8B5BF" font-size="17">Capability emerges from the policy, runtime, and environment evolving together.</text>

    <g transform="translate(58 184)">
      <rect width="280" height="126" rx="8" fill="#111A22" stroke="#45D2E8" stroke-width="2"/>
      <circle cx="27" cy="27" r="8" fill="#45D2E8"/>
      <text x="47" y="32" fill="#74DEEE" font-size="12" font-weight="700">01 / POLICY</text>
      <text x="20" y="75" fill="#F5F7F9" font-size="25" font-weight="730">MODEL</text>
      <text x="20" y="103" fill="#93A5B2" font-size="14">reason / plan / adapt</text>
    </g>

    <g transform="translate(460 184)">
      <rect width="280" height="126" rx="8" fill="#111A22" stroke="#9DE65C" stroke-width="2"/>
      <circle cx="27" cy="27" r="8" fill="#9DE65C"/>
      <text x="47" y="32" fill="#B9F184" font-size="12" font-weight="700">02 / CONTROL PLANE</text>
      <text x="20" y="75" fill="#F5F7F9" font-size="25" font-weight="730">AGENT RUNTIME</text>
      <text x="20" y="103" fill="#93A5B2" font-size="14">context / tools / state / recovery</text>
    </g>

    <g transform="translate(862 184)">
      <rect width="280" height="126" rx="8" fill="#111A22" stroke="#FF806E" stroke-width="2"/>
      <circle cx="27" cy="27" r="8" fill="#FF806E"/>
      <text x="47" y="32" fill="#FFA395" font-size="12" font-weight="700">03 / REALITY</text>
      <text x="20" y="75" fill="#F5F7F9" font-size="25" font-weight="730">ENVIRONMENT</text>
      <text x="20" y="103" fill="#93A5B2" font-size="14">tasks / verifiers / rewards</text>
    </g>

    <path d="M350 247H444" fill="none" stroke="#45D2E8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
    <text x="397" y="232" fill="#74DEEE" font-size="11" font-weight="700" text-anchor="middle">INFERENCE</text>

    <path d="M752 247H846" fill="none" stroke="#9DE65C" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="799" y="232" fill="#B9F184" font-size="11" font-weight="700" text-anchor="middle">ACTION</text>

    <path d="M1002 326C948 428 252 428 198 326" fill="none" stroke="#FF806E" stroke-width="3" marker-end="url(#arrow-coral)"/>
    <rect x="403" y="376" width="394" height="30" rx="4" fill="#080D12"/>
    <text x="600" y="397" fill="#FFA395" font-size="13" font-weight="700" text-anchor="middle">TRAJECTORIES + VERIFICATION + REWARD</text>

    <g transform="translate(58 452)">
      <text x="0" y="0" fill="#6F8290" font-size="12" font-weight="700">EXPERIENCE FLYWHEEL</text>
      <text x="183" y="0" fill="#D8E0E5" font-size="13">ROLLOUT</text>
      <text x="252" y="0" fill="#667784" font-size="13">-&gt;</text>
      <text x="282" y="0" fill="#D8E0E5" font-size="13">TRACE</text>
      <text x="333" y="0" fill="#667784" font-size="13">-&gt;</text>
      <text x="363" y="0" fill="#D8E0E5" font-size="13">VERIFY</text>
      <text x="423" y="0" fill="#667784" font-size="13">-&gt;</text>
      <text x="453" y="0" fill="#D8E0E5" font-size="13">LEARN</text>
      <text x="507" y="0" fill="#667784" font-size="13">-&gt;</text>
      <text x="537" y="0" fill="#F5F7F9" font-size="13" font-weight="700">EVOLVE</text>
    </g>

    <text x="1142" y="452" fill="#70818E" font-size="11" text-anchor="end">LONG-HORIZON / TRAJECTORY-NATIVE / SELF-IMPROVING</text>
  </g>
</svg>
